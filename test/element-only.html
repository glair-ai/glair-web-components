<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test: element methods without the SDK script</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; }
      h1 { font-size: 18px; }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
      button { padding: 6px 10px; cursor: pointer; }
      pre { background: #f4f4f4; padding: 10px; min-height: 220px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Element methods without gl-chat-widget-sdk</h1>
    <p>
      Run with <code>npm run test:element-only</code>. Only the component
      scripts are loaded — <code>window.GLChat</code> must be undefined.
    </p>

    <div class="controls">
      <button id="sidebar-context">sidebar.setContext()</button>
      <button id="sidebar-open">sidebar.open()</button>
      <button id="widget-context">widget.setContext()</button>
      <button id="widget-open">widget.open()</button>
    </div>

    <gl-chat-sidebar id="s" url="/test/mock-chat.html" position="right" width="375"></gl-chat-sidebar>
    <gl-chat-widget id="w" url="/test/mock-chat.html" position="left" color-theme="#00709F"></gl-chat-widget>

    <pre id="log"></pre>

    <script type="module">
      // No gl-chat-widget-sdk import: the component bundles include the bridge.
      import "/src/components/gl-chat-sidebar.ts";
      import "/src/components/gl-chat-widget.ts";

      await Promise.all([
        customElements.whenDefined("gl-chat-sidebar"),
        customElements.whenDefined("gl-chat-widget"),
      ]);

      const log = document.querySelector("#log");
      const write = (message) => {
        log.textContent += `${new Date().toISOString().slice(11, 19)} ${message}\n`;
      };

      window.addEventListener("message", (event) => {
        if (event.data?.type === "glchat-test:received") {
          write(`iframe <- ${JSON.stringify(event.data.payload)}`);
        }
      });

      const bind = (id, fn) =>
        (document.querySelector(`#${id}`).onclick = () => {
          write(`call ${id}()`);
          fn();
        });

      bind("sidebar-context", () =>
        document
          .querySelector("#s")
          .setContext({ entities: [{ type: "employee", id: "E-123" }] }),
      );
      bind("sidebar-open", () => document.querySelector("#s").open());
      bind("widget-context", () =>
        document
          .querySelector("#w")
          .setContext({ page: { route: "element-only.detail" } }),
      );
      bind("widget-open", () => document.querySelector("#w").open());

      write(`window.GLChat present: ${Boolean(window.GLChat)} (expected false)`);
    </script>
  </body>
</html>
